<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Bản rút gọn của icons/icon.svg cho tab trình duyệt (16–48px): bỏ chữ, bóng, xoay —
       chỉ giữ nền đỏ→cam, tấm vé kem và vạch quét xanh để nhỏ vẫn nhận ra. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DC2626"/>
      <stop offset=".5" stop-color="#EA580C"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Vé có khấc bán nguyệt hai bên -->
  <path fill="#FFFBEB" d="M6 8.5h20a1.5 1.5 0 0 1 1.5 1.5v3.5a2.5 2.5 0 0 0 0 5V22a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 22v-3.5a2.5 2.5 0 0 0 0-5V10A1.5 1.5 0 0 1 6 8.5z"/>
  <!-- Dãy số -->
  <g fill="#DC2626">
    <rect x="8" y="10.75" width="4.5" height="3.5" rx="1"/>
    <rect x="13.75" y="10.75" width="4.5" height="3.5" rx="1"/>
    <rect x="19.5" y="10.75" width="4.5" height="3.5" rx="1"/>
  </g>
  <rect x="8" y="19" width="9" height="1.75" rx=".875" fill="#D6C7A1"/>
  <!-- Vạch quét -->
  <rect x="2" y="15.75" width="28" height="1.75" rx=".875" fill="#10B981"/>
</svg>
